<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الآمنة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; background: white; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        
        .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 13px; flex: 1; min-width: 130px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-copy { background-color: #3b82f6; }
        .btn-shorten { background-color: #8b5cf6; } 
        .btn-downloader { background-color: #f59e0b; color: #000; } 
        .btn-replace { background-color: #10b981; }
        .btn-delete { background-color: #ef4444; }
        
        .progress-container { display: none; margin-top: 15px; background-color: #e0e0e0; border-radius: 6px; overflow: hidden; height: 28px; }
        .progress-bar { width: 0%; height: 100%; background-color: #34a853; text-align: center; line-height: 28px; color: white; transition: width 0.2s; font-weight: bold; }
        .file-item { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .file-name { font-weight: bold; font-size: 17px; color: #1e293b; margin-bottom: 8px; }
        .file-link { display: block; font-size: 13px; color: #64748b; background: #e2e8f0; padding: 8px; margin-bottom: 10px; direction: ltr; text-align: left; word-break: break-all; border-radius: 4px; }
        
/* نظام الإشعارات الجديد والجميل */
        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { padding: 14px 24px; border-radius: 8px; font-weight: bold; color: white; box-shadow: 0 10px 15px rgba(0,0,0,0.2); animation: slide 0.3s ease; }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <h1>لوحة إدارة تطبيقات المتجر 📱</h1>

    <div id="authPanel" class="file-item">
        <h2>🔐 دخول صاحب اللوحة</h2>
        <p>سجّل الدخول بالبريد المخصص للمالك لعرض أدوات الرفع.</p>
        <div class="form-group"><input id="adminEmail" type="email" value="01776787858de@gmail.com" readonly></div>
        <div class="form-group"><input id="adminPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>
        <button onclick="signInAdmin()">تسجيل الدخول</button>
        <button onclick="signUpAdmin()" style="background:#0f9d58">إنشاء الحساب لأول مرة</button>
        <p id="authStatus"></p>
    </div>
    <div id="uploadPanel" class="file-item" style="display:none">
        <h2>📤 رفع تطبيق جديد</h2>
        <div class="form-group"><input type="file" id="apkFile" accept=".apk,application/vnd.android.package-archive"></div>
        <button id="uploadBtn" onclick="uploadApk()">رفع التطبيق إلى السيرفر 🚀</button>
        <button onclick="signOutAdmin()" style="background:#64748b">تسجيل الخروج</button>
    </div>
    <div id="mainDashboard">
        <p>عرض التطبيقات وإنشاء روابط تنزيل لمرة واحدة. رفع التطبيقات متاح بعد تسجيل دخول المالك.</p>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div style="margin-top: 40px;">
            <h2>📦 التطبيقات المرفوعة</h2>
            <div id="filesContainer">⏳ جاري جلب التطبيقات...</div>
        </div>
    </div>
</div>

<script>

const REPO="01776787858de/apps", GITHUB_PAGES_URL="https://01776787858de.github.io/apps";
const SUPABASE_URL="https://hauuwbwrgmaaovnmcoug.supabase.co";
const STORAGE_URL="https://hauuwbwrgmaaovnmcoug.storage.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXV3YndyZ21hYW92bm1jb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzMwOTcsImV4cCI6MjEwOTg0OTA5N30.sLxHyBr5FPMvZRmJ6g5jPLvbzOf3EbIndYQqBFjHtJ8";
const OWNER_EMAIL="01776787858de@gmail.com", SESSION_KEY="abogilan_apk_admin_session";
let adminSession=null;
function showToast(msg,type="success"){const el=document.createElement("div");el.className="toast";el.style.backgroundColor=type==="error"?"#ef4444":type==="warning"?"#f59e0b":"#10b981";if(type==="warning")el.style.color="#000";el.textContent=msg;document.getElementById("toast-container").appendChild(el);setTimeout(()=>el.remove(),5000);}
function headers(token){return {apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+(token||SUPABASE_ANON_KEY)};}
async function jsonResponse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{};}catch(_){d={message:t};}if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||("HTTP "+r.status));return d;}
async function authPost(path,body){const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});return jsonResponse(r);}
function updateAuthUI(){const owner=!!adminSession&&(adminSession.user.email||"").toLowerCase()===OWNER_EMAIL;document.getElementById("authPanel").style.display=owner?"none":"block";document.getElementById("uploadPanel").style.display=owner?"block":"none";}
function saveSession(s){if(!s||!s.access_token||!s.user||(s.user.email||"").toLowerCase()!==OWNER_EMAIL)throw new Error("هذا الحساب غير مصرح له.");adminSession=s;try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));}catch(_){}}
async function restoreSession(){let s=null;try{s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");}catch(_){}if(!s||!s.access_token)return;try{const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:headers(s.access_token),cache:"no-store"});if(r.ok){s.user=await r.json();if((s.user.email||"").toLowerCase()===OWNER_EMAIL){adminSession=s;sessionStorage.setItem(SESSION_KEY,JSON.stringify(s));return;}}}catch(_){}if(s.refresh_token){try{saveSession(await authPost("token?grant_type=refresh_token",{refresh_token:s.refresh_token}));return;}catch(_){}}try{sessionStorage.removeItem(SESSION_KEY);}catch(_){}adminSession=null;}
async function signInAdmin(){const password=document.getElementById("adminPassword").value,status=document.getElementById("authStatus");if(!password){status.textContent="أدخل كلمة المرور أولاً.";return;}status.textContent="جارٍ التحقق...";try{saveSession(await authPost("token?grant_type=password",{email:OWNER_EMAIL,password}));document.getElementById("adminPassword").value="";status.textContent="";updateAuthUI();showToast("تم تسجيل الدخول ✅");}catch(e){status.textContent="تعذر تسجيل الدخول: "+e.message;}}
async function signUpAdmin(){const password=document.getElementById("adminPassword").value,status=document.getElementById("authStatus");if(password.length<10){status.textContent="اختر كلمة مرور من 10 أحرف على الأقل.";return;}status.textContent="جارٍ إنشاء الحساب...";try{const d=await authPost("signup",{email:OWNER_EMAIL,password});if(d.access_token){saveSession(d);updateAuthUI();status.textContent="";showToast("تم إنشاء الحساب والدخول ✅");}else status.textContent="تم إرسال رسالة تأكيد إلى بريدك. أكّد الحساب ثم سجّل الدخول.";}catch(e){status.textContent="تعذر إنشاء الحساب: "+e.message;}}
async function signOutAdmin(){if(adminSession&&adminSession.access_token){try{await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:headers(adminSession.access_token)});}catch(_){}}adminSession=null;try{sessionStorage.removeItem(SESSION_KEY);}catch(_){}updateAuthUI();showToast("تم تسجيل الخروج.");}
function b64(v){return btoa(unescape(encodeURIComponent(v)));}
function setProgress(p,label){const wrap=document.getElementById("progressContainer"),bar=document.getElementById("progressBar");wrap.style.display="block";bar.style.width=Math.min(100,Math.max(0,p))+"%";bar.textContent=label||Math.round(p)+"%";}
async function uploadLargeApk(file,path){const endpoint=STORAGE_URL+"/storage/v1/upload/resumable";const metadata=["bucketName "+b64("apk-files"),"objectName "+b64(path),"contentType "+b64("application/vnd.android.package-archive"),"cacheControl "+b64("3600")].join(",");const init=await fetch(endpoint,{method:"POST",headers:{...headers(adminSession.access_token),"Tus-Resumable":"1.0.0","Upload-Length":String(file.size),"Upload-Metadata":metadata,"x-upsert":"false"}});if(!init.ok)await jsonResponse(init);const loc=init.headers.get("Location");if(!loc)throw new Error("لم يُرجع الخادم رابط جلسة الرفع.");const uploadUrl=new URL(loc,endpoint).toString(),chunkSize=6*1024*1024;let offset=0;while(offset<file.size){const chunk=file.slice(offset,Math.min(offset+chunkSize,file.size));const r=await fetch(uploadUrl,{method:"PATCH",headers:{...headers(adminSession.access_token),"Tus-Resumable":"1.0.0","Upload-Offset":String(offset),"Content-Type":"application/offset+octet-stream"},body:chunk});if(!r.ok)await jsonResponse(r);const next=Number(r.headers.get("Upload-Offset"));offset=Number.isFinite(next)&&next>offset?next:offset+chunk.size;setProgress(offset/file.size*100,Math.round(offset/file.size*100)+"%");}}
async function uploadApk(){if(!adminSession||!adminSession.access_token||(adminSession.user.email||"").toLowerCase()!==OWNER_EMAIL){showToast("سجّل الدخول أولاً.","warning");return;}const file=document.getElementById("apkFile").files[0];if(!file||!file.name.toLowerCase().endsWith(".apk")){showToast("اختر ملف APK صالحاً.","warning");return;}if(file.size>500*1024*1024){showToast("الحد الأقصى 500 ميغابايت.","warning");return;}const path=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"-"),btn=document.getElementById("uploadBtn");btn.disabled=true;setProgress(0,"بدء الرفع...");try{await uploadLargeApk(file,path);document.getElementById("apkFile").value="";setProgress(100,"اكتمل الرفع ✅");showToast("تم رفع التطبيق بنجاح 🎉");await fetchFiles();}catch(e){showToast("فشل الرفع: "+e.message,"error");}finally{btn.disabled=false;btn.textContent="رفع التطبيق إلى السيرفر 🚀";setTimeout(()=>{document.getElementById("progressContainer").style.display="none";},5000);}}
async function fetchFiles(){const box=document.getElementById("filesContainer");box.textContent="⏳ جاري جلب التطبيقات...";const items=[],errors=[];try{const r=await Promise.race([fetch("https://api.github.com/repos/"+REPO+"/contents/",{headers:{Accept:"application/vnd.github+json"},cache:"no-store"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("انتهت مهلة GitHub")),10000))]);if(!r.ok)throw new Error("GitHub HTTP "+r.status);(await r.json()).filter(x=>x.name&&x.name.toLowerCase().endsWith(".apk")).forEach(x=>items.push({name:x.name,url:GITHUB_PAGES_URL+"/"+x.path,id:"gh-"+x.sha}));}catch(e){errors.push(e.message);}try{const r=await Promise.race([fetch(SUPABASE_URL+"/storage/v1/object/list/apk-files",{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify({prefix:"",limit:200,offset:0,sortBy:{column:"created_at",order:"desc"}}),cache:"no-store"}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("انتهت مهلة Supabase")),12000))]);(await jsonResponse(r)).filter(x=>x.name&&x.name.toLowerCase().endsWith(".apk")).forEach(x=>items.push({name:x.name.replace(/^[0-9]+-/,""),url:SUPABASE_URL+"/storage/v1/object/public/apk-files/"+encodeURIComponent(x.name),id:"st-"+x.name.replace(/[^a-zA-Z0-9_-]/g,"_")}));}catch(e){errors.push("Supabase: "+e.message);}if(!items.length){box.innerHTML="";const p=document.createElement("p");p.textContent="لم نتمكن من جلب التطبيقات.";const detail=document.createElement("p");detail.style.color="#b45309";detail.textContent=errors.join(" — ")||"لم يتم العثور على ملفات APK.";const retry=document.createElement("button");retry.textContent="إعادة المحاولة 🔄";retry.onclick=fetchFiles;box.append(p,detail,retry);return;}box.innerHTML="";items.forEach(file=>{const id=file.id,card=document.createElement("div");card.className="file-item";const name=document.createElement("div");name.className="file-name";name.textContent="🤖 "+file.name;const link=document.createElement("div");link.className="file-link";link.id="link-"+id;link.textContent=file.url;const buttons=document.createElement("div");buttons.className="buttons-grid";const copy=document.createElement("button");copy.className="btn-small btn-copy";copy.textContent="📋 نسخ الرابط";copy.onclick=()=>copyLink(id);const short=document.createElement("button");short.className="btn-small btn-shorten";short.id="btn-short-"+id;short.textContent="⚡ تقصير تلقائي (Tiny)";short.onclick=()=>generateShortLink(file.url,short.id);const aftv=document.createElement("button");aftv.className="btn-small btn-downloader";aftv.textContent="📺 كود AFTVnews";aftv.onclick=()=>openDownloaderSite(file.url);const once=document.createElement("button");once.className="btn-small";once.style.background="#7c3aed";once.id="btn-onetime-"+id;once.textContent="🔒 إنشاء ونسخ رابط لمرة واحدة";once.onclick=()=>createOneTimeLink(file.url,file.name,id);buttons.append(copy,short,aftv,once);const result=document.createElement("div");result.className="file-link";result.id="one-time-"+id;result.style.display="none";card.append(name,link,buttons,result);box.appendChild(card);});if(errors.length){const note=document.createElement("p");note.style.color="#b45309";note.textContent="تنبيه: "+errors.join(" — ");box.appendChild(note);}}
async function copyLink(id){try{await navigator.clipboard.writeText(document.getElementById("link-"+id).textContent);showToast("تم نسخ الرابط ✅");}catch(_){showToast("تعذر النسخ التلقائي. انسخ الرابط يدوياً.","warning");}}
async function generateShortLink(url,id){const btn=document.getElementById(id);btn.disabled=true;btn.textContent="⏳ جاري التقصير...";try{const r=await fetch("https://tinyurl.com/api-create.php?url="+encodeURIComponent(url));if(!r.ok)throw new Error("فشل الاتصال");const short=(await r.text()).trim();btn.textContent="✅ "+short.replace("https://","").replace("http://","");btn.style.backgroundColor="#10b981";btn.onclick=async()=>{try{await navigator.clipboard.writeText(short);showToast("تم نسخ الرابط المختصر ✅");}catch(_){showToast("تعذر النسخ.","warning");}};}catch(e){btn.textContent="❌ فشل، حاول مجدداً";showToast(e.message,"error");}finally{btn.disabled=false;}}
function openDownloaderSite(url){window.open("https://go.aftvnews.com/","_blank");navigator.clipboard.writeText(url).then(()=>showToast("تم نسخ الرابط! الصقه في موقع AFTVnews."),()=>showToast("انسخ الرابط يدوياً.","warning"));}
async function createOneTimeLink(apkUrl,appName,id){const box=document.getElementById("one-time-"+id),btn=document.getElementById("btn-onetime-"+id);btn.disabled=true;btn.textContent="⏳ جاري إنشاء الرابط...";try{const r=await fetch(SUPABASE_URL+"/functions/v1/create-download-link",{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify({apkUrl,appName})});const d=await jsonResponse(r);box.style.display="block";box.textContent=d.downloadUrl;try{await navigator.clipboard.writeText(d.downloadUrl);}catch(_){}showToast("تم إنشاء رابط التنزيل لمرة واحدة ✅");}catch(e){showToast("تعذر إنشاء الرابط: "+e.message,"error");}finally{btn.disabled=false;btn.textContent="🔒 إنشاء ونسخ رابط لمرة واحدة";}}
window.addEventListener("load",()=>{updateAuthUI();fetchFiles();restoreSession().then(updateAuthUI).catch(e=>console.warn(e));});



</body>
</html>
