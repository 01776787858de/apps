<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الآمنة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; background: white; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        
        .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 13px; flex: 1; min-width: 130px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-copy { background-color: #3b82f6; }
        .btn-shorten { background-color: #8b5cf6; } 
        .btn-downloader { background-color: #f59e0b; color: #000; } 
        .btn-replace { background-color: #10b981; }
        .btn-delete { background-color: #ef4444; }
        
        .progress-container { display: none; margin-top: 15px; background-color: #e0e0e0; border-radius: 6px; overflow: hidden; height: 28px; }
        .progress-bar { width: 0%; height: 100%; background-color: #34a853; text-align: center; line-height: 28px; color: white; transition: width 0.2s; font-weight: bold; }
        .file-item { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .file-name { font-weight: bold; font-size: 17px; color: #1e293b; margin-bottom: 8px; }
        .file-link { display: block; font-size: 13px; color: #64748b; background: #e2e8f0; padding: 8px; margin-bottom: 10px; direction: ltr; text-align: left; word-break: break-all; border-radius: 4px; }
        
        #tokenScreen { background: #fff3cd; padding: 20px; border-radius: 8px; border: 1px solid #ffeeba; margin-bottom: 20px; }

        /* نظام الإشعارات الجديد والجميل */
        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { padding: 14px 24px; border-radius: 8px; font-weight: bold; color: white; box-shadow: 0 10px 15px rgba(0,0,0,0.2); animation: slide 0.3s ease; }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>

</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <h1>لوحة إدارة تطبيقات المتجر 📱</h1>

    <div style="background:#ecfdf5;padding:12px;border-radius:8px;margin-bottom:18px;color:#065f46;">
        ✅ الرفع المباشر إلى مساحة التخزين — لا يحتاج GitHub Token.
    </div>

    <div id="mainDashboard" style="display: none;">
        <div class="form-group">
            <label>1. اختر التطبيق من الجوال:</label>
            <input type="file" id="apkFile" accept=".apk">
        </div>
        <div class="form-group">
            <label>2. اسم التطبيق النهائي:</label>
            <input type="text" id="appName" placeholder="مثال: iptv-app.apk">
        </div>
        <button id="uploadBtn" onclick="uploadFile()">🚀 رفع التطبيق إلى GitHub</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div style="margin-top: 32px;">
            <h2>📦 التطبيقات القديمة</h2>
            <div id="filesContainer">⏳ جاري جلب التطبيقات...</div>
        </div>
        <div style="margin-top: 32px;">
            <h2>☁️ التطبيقات المرفوعة مباشرة</h2>
            <p>روابط تحميل مباشرة من مساحة التخزين، حتى 500 MB للملف.</p>
            <div id="releaseFilesContainer">⏳ جاري جلب التطبيقات...</div>
        </div>
    </div>
</div>

<script>
    const REPO = "01776787858de/apps";
    const GITHUB_PAGES_URL = "https://01776787858de.github.io/apps";
    // Public Supabase client settings are kept in code, not shown as editable dashboard fields.
    const SUPABASE_URL = "https://hauuwbwrgmaaovnmcoug.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXV3YndyZ21hYW92bm1jb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzMwOTcsImV4cCI6MjEwOTg0OTA5N30.sLxHyBr5FPMvZRmJ6g5jPLvbzOf3EbIndYQqBFjHtJ8";
    
    window.onload = function() {
        document.getElementById("mainDashboard").style.display = "block";
        fetchFiles();
        fetchReleaseAssets();
    };

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.backgroundColor = type === 'error' ? '#ef4444' : (type === 'warning' ? '#f59e0b' : '#10b981');
        if(type === 'warning') toast.style.color = '#000';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 4000);
    }

    async function saveToken() {
        const tokenVal = document.getElementById("ghTokenInput").value.trim();
        if (!tokenVal.startsWith("ghp_") && !tokenVal.startsWith("github_pat_")) {
            showToast("الرمز غير صحيح! يجب أن يبدأ بـ ghp_ أو github_pat_", "error");
            return;
        }
        try {
            const response = await fetch(`https://api.github.com/repos/${REPO}`, {
                headers: {
                    "Authorization": "Bearer " + tokenVal,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                },
                cache: "no-store"
            });
            const data = await response.json();
            if (!response.ok) throw new Error("فحص المستودع فشل (" + response.status + "): " + (data.message || "GitHub رفض الرمز"));
            if (data?.permissions?.push !== true) throw new Error("الرمز لا يملك صلاحية الكتابة على مستودع apps");
            // Verify the exact Releases endpoint used by APK uploads, not just repository access.
            const releaseCheck = await fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=1", {
                headers: {
                    "Authorization": "Bearer " + tokenVal,
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                },
                cache: "no-store"
            });
            const releaseData = await releaseCheck.json();
            if (!releaseCheck.ok) throw new Error("فشل فحص صلاحية Releases (" + releaseCheck.status + "): " + (releaseData.message || "لا يمكن الوصول إلى Releases"));
            localStorage.setItem("github_token", tokenVal);
            document.getElementById("ghTokenInput").value = "";
            document.getElementById("tokenScreen").style.display = "none";
            document.getElementById("mainDashboard").style.display = "block";
            showToast("تم التحقق من GitHub Token وحفظه بنجاح ✅", "success");
        } catch (error) {
            showToast("رمز GitHub غير صالح أو ناقص الصلاحيات: " + error.message, "error");
        }
    }

    function logout() {
        localStorage.removeItem("github_token");
        document.getElementById("ghTokenInput").value = "";
        document.getElementById("tokenScreen").style.display = "block";
        showToast("أدخل رمز GitHub جديداً. ستبقى التطبيقات ظاهرة أثناء ذلك.", "warning");
        fetchFiles();
    }

    document.getElementById('apkFile').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            let name = e.target.files[0].name.replace(/\s+/g, '-').toLowerCase();
            if(!name.endsWith('.apk')) name += '.apk';
            document.getElementById('appName').value = name;
        }
    });

    async function fetchFiles() {
        const token = localStorage.getItem("github_token");
        const container = document.getElementById('filesContainer');
        try {
            // This repository is public, so list APKs anonymously. Do not let an expired
            // personal token hide the existing applications from the dashboard.
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/`, {
                headers: { "Accept": "application/vnd.github+json" },
                cache: "no-store"
            });
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.message || "خطأ في جلب الملفات");
            
            const apkFiles = data.filter(f => f.name.endsWith('.apk'));
            if(apkFiles.length === 0) {
                container.innerHTML = "<p>لا يوجد تطبيقات حالياً.</p>";
                return;
            }

            container.innerHTML = "";
            apkFiles.forEach(file => {
                const downloadUrl = `${GITHUB_PAGES_URL}/${file.path}`;
                const btnShortId = `btn-short-${file.sha}`;

                container.innerHTML += `
                    <div class="file-item">
                        <div class="file-name">🤖 ${file.name}</div>
                        <div class="file-link" id="link-${file.sha}">${downloadUrl}</div>
                        
                        <div class="buttons-grid">
                            <button class="btn-small btn-copy" onclick="copyLink('${file.sha}')">📋 نسخ الرابط</button>
                            <button class="btn-small btn-shorten" id="${btnShortId}" onclick="generateShortLink('${downloadUrl}', '${btnShortId}')">⚡ تقصير تلقائي (Tiny)</button>
                            <button class="btn-small btn-downloader" onclick="openDownloaderSite('${downloadUrl}')">📺 كود AFTVnews</button>
                            <button class="btn-small" style="background:#7c3aed" id="btn-onetime-${file.sha}" onclick="createOneTimeLink('${downloadUrl}', '${file.name}', '${file.sha}')">🔒 إنشاء ونسخ رابط لمرة واحدة</button>
                            <button class="btn-small btn-replace" onclick="replaceFile('${file.name}', '${file.sha}')">🔄 استبدال</button>
                            <button class="btn-small btn-delete" onclick="deleteFile('${file.name}', '${file.sha}')">❌ حذف</button>
                        </div>
                        <div id="one-time-${file.sha}" class="file-link" style="display:none;margin-top:10px;background:#ecfdf5;color:#065f46"></div>
                    </div>
                `;
            });
        } catch (err) {
            container.innerHTML = `<p style="color:red;">خطأ: ${err.message}</p>`;
        }
    }

    function copyLink(sha) {
        const link = document.getElementById(`link-${sha}`).innerText;
        navigator.clipboard.writeText(link).then(() => {
            showToast("تم نسخ الرابط بنجاح! ✅", "success");
        }).catch(() => showToast("فشل النسخ.", "error"));
    }

    async function generateShortLink(url, btnId) {
        const btn = document.getElementById(btnId);
        btn.innerHTML = "⏳ جاري التقصير...";
        btn.disabled = true;
        
        try {
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
            if (!response.ok) throw new Error("فشل الاتصال");
            
            const shortUrl = await response.text();
            let cleanUrl = shortUrl.replace(/^https?:\/\//, ''); 
            
            btn.innerHTML = `✅ ${cleanUrl}`;
            btn.style.backgroundColor = "#10b981"; 
            btn.disabled = false;
            
            btn.onclick = function() {
                navigator.clipboard.writeText(shortUrl).then(() => {
                    showToast(`تم نسخ الرابط: ${cleanUrl}`, "success");
                });
            };
        } catch (error) {
            btn.innerHTML = "❌ فشل، حاول مجدداً";
            btn.style.backgroundColor = "#ef4444"; 
            btn.disabled = false;
        }
    }

    // هنا تم التحديث للرابط الجديد الصحيح
    function openDownloaderSite(url) {
        window.open("https://go.aftvnews.com/", "_blank");
        navigator.clipboard.writeText(url).then(() => {
            showToast("تم نسخ الرابط! الصقه في موقع AFTVnews.", "success");
        }).catch(() => {
            showToast("يرجى نسخ الرابط يدوياً", "warning");
        });
    }

    async function deleteFile(filename, sha) {
        if(!confirm(`هل أنت متأكد من حذف ${filename} نهائياً؟`)) return;
        const token = localStorage.getItem("github_token");
        
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filename}`, {
                method: "DELETE",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: `Delete ${filename}`, sha: sha })
            });
            if(res.ok) {
                showToast("تم الحذف بنجاح! 🗑️", "success");
                fetchFiles();
            } else {
                showToast("فشل الحذف!", "error");
            }
        } catch(e) { showToast("خطأ: " + e.message, "error"); }
    }

    function replaceFile(filename, sha) {
        const fileInput = document.getElementById('apkFile');
        if(!fileInput.files[0]) {
            showToast("⚠️ الرجاء اختيار ملف التطبيق الجديد من الأعلى أولاً!", "warning");
            return;
        }
        if(confirm(`هل تريد استبدال ${filename} بالملف الجديد؟`)) {
            processUpload(fileInput.files[0], filename, sha);
        }
    }

    function uploadFile() {
        const file = document.getElementById('apkFile').files[0];
        const filename = document.getElementById('appName').value.trim();
        
        if (!file) {
            showToast("⚠️ الرجاء اختيار ملف APK من جهازك أولاً!", "warning");
            return;
        }
        if (!filename.endsWith('.apk')) {
            showToast("يجب أن ينتهي اسم الملف بـ .apk", "error");
            return;
        }
        
        processUpload(file, filename, null);
    }

    async function getOrCreateUploadRelease(token) {
        const headers = {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        };
        const listRes = await fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=100", { headers, cache: "no-store" });
        const releases = await listRes.json();
        if (!listRes.ok) throw new Error("قراءة Releases (" + listRes.status + "): " + (releases.message || "رفض GitHub الطلب"));
        let release = releases.find(item => item.tag_name === "apps-downloads");
        if (!release) {
            const createRes = await fetch("https://api.github.com/repos/" + REPO + "/releases", {
                method: "POST",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({
                    tag_name: "apps-downloads",
                    target_commitish: "main",
                    name: "Apps Downloads",
                    body: "APK files uploaded through the apps dashboard.",
                    draft: false,
                    prerelease: false
                })
            });
            release = await createRes.json();
            if (!createRes.ok) throw new Error("إنشاء Release (" + createRes.status + "): " + (release.message || "رفض GitHub الطلب") + (release.documentation_url ? " · " + release.documentation_url : ""));
        }
        return release;
    }

    async function fetchReleaseAssets() {
        const container = document.getElementById("releaseFilesContainer");
        try {
            const response = await fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=100", {
                headers: { "Accept": "application/vnd.github+json" },
                cache: "no-store"
            });
            const releases = await response.json();
            if (!response.ok) throw new Error(releases.message || "تعذر جلب الإصدارات");
            const release = releases.find(item => item.tag_name === "apps-downloads");
            const assets = release?.assets || [];
            if (!assets.length) {
                container.innerHTML = "<p>لا توجد تطبيقات كبيرة مرفوعة بعد. اختر ملف APK واضغط رفع التطبيق.</p>";
                return;
            }
            container.innerHTML = "";
            assets.filter(a => a.name.toLowerCase().endsWith(".apk")).forEach(asset => {
                const item = document.createElement("div");
                item.className = "file-item";
                const name = document.createElement("div");
                name.className = "file-name";
                name.textContent = "📱 " + asset.name + " · " + (asset.size / (1024 * 1024)).toFixed(1) + " MB";
                const link = document.createElement("div");
                link.className = "file-link";
                link.textContent = asset.browser_download_url;
                const buttons = document.createElement("div");
                buttons.className = "buttons-grid";
                const copy = document.createElement("button");
                copy.className = "btn-small btn-copy";
                copy.textContent = "📋 نسخ الرابط";
                copy.onclick = () => navigator.clipboard.writeText(asset.browser_download_url).then(() => showToast("تم نسخ الرابط", "success"));
                const once = document.createElement("button");
                once.className = "btn-small";
                once.style.background = "#7c3aed";
                once.textContent = "🔒 رابط لمرة واحدة";
                once.onclick = () => createOneTimeLink(asset.browser_download_url, asset.name, "release-" + asset.id);
                const aftv = document.createElement("button");
                aftv.className = "btn-small btn-downloader";
                aftv.textContent = "📺 AFTVnews";
                aftv.onclick = () => openDownloaderSite(asset.browser_download_url);
                const del = document.createElement("button");
                del.className = "btn-small btn-delete";
                del.textContent = "❌ حذف";
                del.onclick = () => deleteReleaseAsset(asset.id, asset.name);
                buttons.append(copy, once, aftv, del);
                item.append(name, link, buttons);
                container.appendChild(item);
            });
        } catch (error) {
            container.textContent = "تعذر جلب التطبيقات الكبيرة: " + error.message;
        }
    }

    async function deleteReleaseAsset(assetId, filename) {
        const token = localStorage.getItem("github_token");
        if (!token) { showToast("أدخل GitHub Token أولاً", "warning"); return; }
        if (!confirm("هل تريد حذف " + filename + "؟")) return;
        try {
            const response = await fetch("https://api.github.com/repos/" + REPO + "/releases/assets/" + assetId, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }
            });
            if (!response.ok && response.status !== 204) {
                const data = await response.json();
                throw new Error(data.message || "فشل الحذف");
            }
            showToast("تم حذف التطبيق", "success");
            fetchReleaseAssets();
        } catch (error) { showToast("تعذر الحذف: " + error.message, "error"); }
    }

    async function fetchReleaseAssets() {
        const container = document.getElementById("releaseFilesContainer");
        try {
            const response = await fetch(SUPABASE_URL + "/functions/v1/apk-storage-admin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: "list" }),
                cache: "no-store"
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "تعذر جلب التطبيقات");
            const files = data.files || [];
            if (!files.length) {
                container.innerHTML = "<p>لا توجد تطبيقات مرفوعة بعد.</p>";
                return;
            }
            container.innerHTML = "";
            files.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "file-item";
                const name = document.createElement("div");
                name.className = "file-name";
                const size = file.size ? " · " + (file.size / (1024 * 1024)).toFixed(1) + " MB" : "";
                name.textContent = "📱 " + file.name + size;
                const link = document.createElement("div");
                link.className = "file-link";
                link.textContent = file.url;
                const buttons = document.createElement("div");
                buttons.className = "buttons-grid";
                const copy = document.createElement("button");
                copy.className = "btn-small btn-copy";
                copy.textContent = "📋 نسخ الرابط";
                copy.onclick = () => navigator.clipboard.writeText(file.url).then(() => showToast("تم نسخ الرابط", "success"));
                const once = document.createElement("button");
                once.className = "btn-small";
                once.style.background = "#7c3aed";
                once.textContent = "🔒 رابط لمرة واحدة";
                once.onclick = () => createOneTimeLink(file.url, file.name, "storage-" + index);
                const aftv = document.createElement("button");
                aftv.className = "btn-small btn-downloader";
                aftv.textContent = "📺 كود AFTVnews";
                aftv.onclick = () => openDownloaderSite(file.url);
                buttons.append(copy, once, aftv);
                item.append(name, link, buttons);
                container.appendChild(item);
            });
        } catch (error) {
            container.textContent = "تعذر جلب التطبيقات: " + error.message;
        }
    }

    async function processUpload(file, filename, sha) {
        const uploadBtn = document.getElementById("uploadBtn");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");
        if (file.size > 500 * 1024 * 1024) {
            showToast("حجم الملف يجب أن يكون أقل من 500 MB.", "error"); return;
        }
        const cleanName = filename.split(/[\\/]/).pop().replace(/[^a-zA-Z0-9._-]/g, "_");
        if (!cleanName.toLowerCase().endsWith(".apk")) { showToast("اسم الملف يجب أن ينتهي بـ .apk", "error"); return; }
        uploadBtn.disabled = true;
        progressContainer.style.display = "block";
        progressBar.style.width = "0%"; progressBar.textContent = "0%";
        try {
            const prepareResponse = await fetch(SUPABASE_URL + "/functions/v1/apk-storage-admin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
                body: JSON.stringify({ action: "prepare-upload", filename: cleanName, size: file.size })
            });
            const prepared = await prepareResponse.json();
            if (!prepareResponse.ok) throw new Error(prepared.error || "تعذر تجهيز رابط الرفع");

            await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("PUT", prepared.uploadUrl);
                xhr.setRequestHeader("Content-Type", "application/vnd.android.package-archive");
                xhr.setRequestHeader("x-upsert", "true");
                xhr.upload.onprogress = event => {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        progressBar.style.width = percent + "%";
                        progressBar.textContent = percent + "%";
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) resolve();
                    else reject(new Error("Supabase Storage (" + xhr.status + "): " + (xhr.responseText || "فشل رفع الملف")));
                };
                xhr.onerror = () => reject(new Error("انقطع الاتصال أثناء الرفع"));
                xhr.onabort = () => reject(new Error("تم إلغاء الرفع"));
                xhr.send(file);
            });

            progressBar.style.width = "100%"; progressBar.textContent = "100%";
            showToast("تم رفع التطبيق بنجاح إلى التخزين المباشر 🎉", "success");
            document.getElementById("apkFile").value = "";
            document.getElementById("appName").value = "";
            fetchReleaseAssets();
        } catch (error) {
            showToast("فشل الرفع: " + error.message, "error");
        } finally {
            uploadBtn.disabled = false;
            setTimeout(() => { progressContainer.style.display = "none"; }, 1800);
        }
    }

    async function createOneTimeLink(apkUrl, appName, fileSha) {
        const projectUrl = SUPABASE_URL;
        const anonKey = SUPABASE_ANON_KEY;
        const githubToken = localStorage.getItem("github_token") || "";
        const resultBox = document.getElementById("one-time-" + fileSha);
        const button = document.getElementById("btn-onetime-" + fileSha);
        if (!projectUrl || !anonKey) { showToast("إعدادات Supabase غير مكتملة.", "warning"); return; }
        
        if (button) { button.disabled = true; button.textContent = "⏳ جاري إنشاء الرابط..."; }
        try {
            const response = await fetch(projectUrl + "/functions/v1/create-download-link", {
                method: "POST", headers: { "Content-Type": "application/json", "apikey": anonKey, "Authorization": "Bearer " + anonKey },
                body: JSON.stringify({ apkUrl, appName })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "تعذر إنشاء الرابط");
            if (resultBox) { resultBox.style.display = "block"; resultBox.textContent = data.downloadUrl; }
            await navigator.clipboard.writeText(data.downloadUrl);
            showToast("تم إنشاء رابط " + appName + " ونسخه مباشرةً 📋", "success");
        } catch (error) {
            showToast("تعذر إنشاء/نسخ الرابط: " + error.message, "error");
        } finally {
            if (button) { button.disabled = false; button.textContent = "🔒 إنشاء ونسخ رابط لمرة واحدة"; }
        }
    }
</script>
