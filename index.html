<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الآمنة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; background: white; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1a73e8; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        
        .buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn-small { width: auto; padding: 8px 12px; font-size: 13px; flex: 1; min-width: 130px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .btn-copy { background-color: #3b82f6; }
        .btn-shorten { background-color: #8b5cf6; } 
        .btn-downloader { background-color: #f59e0b; color: #000; } 
        .btn-replace { background-color: #10b981; }
        .btn-delete { background-color: #ef4444; }
        
        .progress-container { display: none; margin-top: 15px; background-color: #e0e0e0; border-radius: 6px; overflow: hidden; height: 28px; }
        .progress-bar { width: 0%; height: 100%; background-color: #34a853; text-align: center; line-height: 28px; color: white; transition: width 0.2s; font-weight: bold; }
        .file-item { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 12px; border-radius: 8px; }
        .file-name { font-weight: bold; font-size: 17px; color: #1e293b; margin-bottom: 8px; }
        .file-link { display: block; font-size: 13px; color: #64748b; background: #e2e8f0; padding: 8px; margin-bottom: 10px; direction: ltr; text-align: left; word-break: break-all; border-radius: 4px; }
        
/* نظام الإشعارات الجديد والجميل */
        #toast-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
        .toast { padding: 14px 24px; border-radius: 8px; font-weight: bold; color: white; box-shadow: 0 10px 15px rgba(0,0,0,0.2); animation: slide 0.3s ease; }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <h1>لوحة إدارة تطبيقات المتجر 📱</h1>

    <div id="mainDashboard">
        <p>هذه لوحة عرض التطبيقات وإنشاء روابط تنزيل لمرة واحدة. إدارة الرفع والحذف غير متاحة من هذه النسخة.</p>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div style="margin-top: 40px;">
            <h2>📦 التطبيقات المرفوعة</h2>
            <div id="filesContainer">⏳ جاري جلب التطبيقات...</div>
        </div>
    </div>
</div>

<script>
    const REPO = "01776787858de/apps";
    const GITHUB_PAGES_URL = "https://01776787858de.github.io/apps";
    // Public Supabase client settings are kept in code, not shown as editable dashboard fields.
    const SUPABASE_URL = "https://hauuwbwrgmaaovnmcoug.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdXV3YndyZ21hYW92bm1jb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzMwOTcsImV4cCI6MjEwOTg0OTA5N30.sLxHyBr5FPMvZRmJ6g5jPLvbzOf3EbIndYQqBFjHtJ8";
    
    window.onload = function() { fetchFiles(); };

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.backgroundColor = type === 'error' ? '#ef4444' : (type === 'warning' ? '#f59e0b' : '#10b981');
        if(type === 'warning') toast.style.color = '#000';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 4000);
    }

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let adminSession = null;
    window.onload = async function() {
        const result = await supabaseClient.auth.getSession();
        adminSession = result.data.session;
        updateAuthUI();
        fetchFiles();
    };
    function updateAuthUI() {
        const owner = !!adminSession && (adminSession.user.email || "").toLowerCase() === "01776787858de@gmail.com";
        document.getElementById("authPanel").style.display = owner ? "none" : "block";
        document.getElementById("uploadPanel").style.display = owner ? "block" : "none";
    }
    async function signInAdmin() {
        const password = document.getElementById("adminPassword").value;
        const r = await supabaseClient.auth.signInWithPassword({email:"01776787858de@gmail.com",password});
        if(r.error){document.getElementById("authStatus").textContent=r.error.message;return;}
        adminSession=r.data.session; updateAuthUI(); showToast("تم تسجيل الدخول"); fetchFiles();
    }
    async function signUpAdmin() {
        const password=document.getElementById("adminPassword").value;
        if(password.length<10){showToast("اختر كلمة مرور من 10 أحرف على الأقل.","warning");return;}
        const r=await supabaseClient.auth.signUp({email:"01776787858de@gmail.com",password});
        document.getElementById("authStatus").textContent=r.error?r.error.message:"تم إنشاء الحساب. افحص بريدك لتأكيد الحساب ثم سجّل الدخول.";
    }
    async function signOutAdmin(){await supabaseClient.auth.signOut();adminSession=null;updateAuthUI();showToast("تم تسجيل الخروج");}
    async function uploadApk() {
        if(!adminSession || (adminSession.user.email||"").toLowerCase()!=="01776787858de@gmail.com"){showToast("سجّل الدخول أولاً.","warning");return;}
        const file=document.getElementById("apkFile").files[0];
        if(!file || !file.name.toLowerCase().endsWith(".apk")){showToast("اختر ملف APK صالحاً.","warning");return;}
        if(file.size>100*1024*1024){showToast("الحد الأقصى 100 ميغابايت.","warning");return;}
        const path=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
        const btn=document.getElementById("uploadBtn");btn.disabled=true;btn.textContent="جاري الرفع...";
        try{
            const r=await supabaseClient.storage.from("apk-files").upload(path,file,{contentType:"application/vnd.android.package-archive",upsert:false});
            if(r.error)throw r.error;
            document.getElementById("apkFile").value="";showToast("تم رفع التطبيق بنجاح");fetchFiles();
        }catch(e){showToast("فشل الرفع: "+e.message,"error");}
        finally{btn.disabled=false;btn.textContent="رفع التطبيق إلى السيرفر 🚀";}
    }
    async function fetchFiles() {
        const container=document.getElementById("filesContainer");container.innerHTML="⏳ جاري جلب التطبيقات...";
        try{
            const items=[];
            const gh=await fetch("https://api.github.com/repos/"+REPO+"/contents/",{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
            if(gh.ok){const files=await gh.json();files.filter(x=>x.name.toLowerCase().endsWith(".apk")).forEach(x=>items.push({name:x.name,url:GITHUB_PAGES_URL+"/"+x.path,id:"gh-"+x.sha}));}
            const stored=await supabaseClient.storage.from("apk-files").list("",{limit:200,sortBy:{column:"created_at",order:"desc"}});
            if(stored.error)throw stored.error;
            (stored.data||[]).filter(x=>x.name.toLowerCase().endsWith(".apk")).forEach(x=>{
                const p=supabaseClient.storage.from("apk-files").getPublicUrl(x.name);
                items.push({name:x.name.replace(/^\\d+-/,""),url:p.data.publicUrl,id:"st-"+x.name.replace(/[^a-zA-Z0-9_-]/g,"_")});
            });
            if(!items.length){container.innerHTML="<p>لا توجد تطبيقات حالياً.</p>";return;}
            container.innerHTML="";
            items.forEach(file=>{
                const id=file.id;
                const card=document.createElement("div");card.className="file-item";
                card.innerHTML='<div class="file-name">🤖 '+file.name+'</div><div class="file-link" id="link-'+id+'"></div><div class="buttons-grid"><button class="btn-small btn-copy" onclick="copyLink(\''+id+'\')">📋 نسخ الرابط</button><button class="btn-small btn-shorten" id="btn-short-'+id+'" onclick="generateShortLink(document.getElementById(\'link-'+id+'\').innerText,\'btn-short-'+id+'\')">⚡ تقصير تلقائي (Tiny)</button><button class="btn-small btn-downloader" onclick="openDownloaderSite(document.getElementById(\'link-'+id+'\').innerText)">📺 كود AFTVnews</button><button class="btn-small" style="background:#7c3aed" id="btn-onetime-'+id+'" onclick="createOneTimeLink(document.getElementById(\'link-'+id+'\').innerText,\''+file.name.replace(/'/g,"")+'\',\''+id+'\')">🔒 إنشاء ونسخ رابط لمرة واحدة</button></div><div id="one-time-'+id+'" class="file-link" style="display:none;margin-top:10px;background:#ecfdf5;color:#065f46"></div>';
                card.querySelector("#link-"+id).textContent=file.url;container.appendChild(card);
            });
        }catch(e){container.innerHTML='<p style="color:red;">خطأ: '+e.message+'</p>';}
    }

    function copyLink(sha) {
        const link = document.getElementById(`link-${sha}`).innerText;
        navigator.clipboard.writeText(link).then(() => {
            showToast("تم نسخ الرابط بنجاح! ✅", "success");
        }).catch(() => showToast("فشل النسخ.", "error"));
    }

    async function generateShortLink(url, btnId) {
        const btn = document.getElementById(btnId);
        btn.innerHTML = "⏳ جاري التقصير...";
        btn.disabled = true;
        
        try {
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
            if (!response.ok) throw new Error("فشل الاتصال");
            
            const shortUrl = await response.text();
            let cleanUrl = shortUrl.replace(/^https?:\/\//, ''); 
            
            btn.innerHTML = `✅ ${cleanUrl}`;
            btn.style.backgroundColor = "#10b981"; 
            btn.disabled = false;
            
            btn.onclick = function() {
                navigator.clipboard.writeText(shortUrl).then(() => {
                    showToast(`تم نسخ الرابط: ${cleanUrl}`, "success");
                });
            };
        } catch (error) {
            btn.innerHTML = "❌ فشل، حاول مجدداً";
            btn.style.backgroundColor = "#ef4444"; 
            btn.disabled = false;
        }
    }

    // هنا تم التحديث للرابط الجديد الصحيح
    function openDownloaderSite(url) {
        window.open("https://go.aftvnews.com/", "_blank");
        navigator.clipboard.writeText(url).then(() => {
            showToast("تم نسخ الرابط! الصقه في موقع AFTVnews.", "success");
        }).catch(() => {
            showToast("يرجى نسخ الرابط يدوياً", "warning");
        });
    }

    async function createOneTimeLink(apkUrl, appName, fileSha) {
        const projectUrl = SUPABASE_URL;
        const anonKey = SUPABASE_ANON_KEY;
const resultBox = document.getElementById("one-time-" + fileSha);
        const button = document.getElementById("btn-onetime-" + fileSha);
        if (!projectUrl || !anonKey) { showToast("إعدادات Supabase غير مكتملة.", "warning"); return; }
if (button) { button.disabled = true; button.textContent = "⏳ جاري إنشاء الرابط..."; }
        try {
            const response = await fetch(projectUrl + "/functions/v1/create-download-link", {
                method: "POST", headers: { "Content-Type": "application/json", "apikey": anonKey, "Authorization": "Bearer " + anonKey },
                body: JSON.stringify({ apkUrl, appName })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "تعذر إنشاء الرابط");
            resultBox.style.display = "block";
            resultBox.textContent = data.downloadUrl;
            await navigator.clipboard.writeText(data.downloadUrl);
            showToast("تم إنشاء رابط " + appName + " ونسخه مباشرةً 📋", "success");
        } catch (error) {
            showToast("تعذر إنشاء/نسخ الرابط: " + error.message, "error");
        } finally {
            if (button) { button.disabled = false; button.textContent = "🔒 إنشاء ونسخ رابط لمرة واحدة"; }
        }
    }
</script>

</body>
</html>
